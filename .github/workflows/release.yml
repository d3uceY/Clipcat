name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - name: Validate stable release tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "Stable release tag detected: $TAG"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release workflow for pre-release/non-stable tag: $TAG"
          fi

  build-linux-amd64:
    runs-on: ubuntu-24.04
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Create webkit2gtk-4.0 pkg-config compatibility shim
        run: |
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf 'Name: webkit2gtk-4.0\nDescription: WebKit2 GTK+ (compat shim for 4.1)\nVersion: 2.44.0\nRequires: webkit2gtk-4.1\nCflags:\nLibs:\n' \
            | sudo tee /usr/local/lib/pkgconfig/webkit2gtk-4.0.pc
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build Linux binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: go build -tags "production webkit2gtk_4_1" -trimpath -buildvcs=false -ldflags="-w -s" -o build/bin/Clipcat-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: build/bin/Clipcat-linux-amd64

  build-macos:
    runs-on: macos-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Process Info.plist
        # Substitute Wails template variables and strip unused conditional blocks
        # so the .app bundle has a valid, fully-resolved plist.
        run: |
          python3 << 'PYEOF'
          import json, re

          with open('wails.json') as f:
              cfg = json.load(f)
          info = cfg.get('info', {})
          out  = cfg.get('outputfilename') or cfg.get('name', 'Clipcat')

          subs = {
              '{{.Info.ProductName}}':    info.get('productName',    'Clipcat'),
              '{{.OutputFilename}}':      out,
              '{{.Name}}':               cfg.get('name',             'Clipcat'),
              '{{.Info.ProductVersion}}': info.get('productVersion', '1.0.0'),
              '{{.Info.Comments}}':       info.get('comments',       ''),
              '{{.Info.Copyright}}':      info.get('copyright',      ''),
          }

          with open('build/darwin/Info.plist') as f:
              content = f.read()

          # Strip Wails {{if}} / {{range}} conditional blocks and their contents
          lines  = content.split('\n')
          result, depth = [], 0
          for line in lines:
              s = line.strip()
              if re.match(r'^\{\{(if|range)\b', s):
                  depth += 1
              elif re.match(r'^\{\{end\}\}', s):
                  depth -= 1
              elif depth == 0:
                  result.append(line)

          content = '\n'.join(result)
          for k, v in subs.items():
              content = content.replace(k, v)

          with open('/tmp/Info.plist', 'w') as f:
              f.write(content)

          print('Generated /tmp/Info.plist')
          PYEOF

      - name: Build macOS ARM64 binary
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
          CGO_CFLAGS: "-mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o build/bin/Clipcat

      - name: Bundle and package ARM64 DMG
        run: |
          mkdir -p artifacts
          APP=build/bin/Clipcat-arm64.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp build/darwin/icons.icns "$APP/Resources/iconfile.icns"
          cp build/bin/Clipcat       "$APP/MacOS/Clipcat"
          cp /tmp/Info.plist         "$APP/Info.plist"
          hdiutil create -volname "Clipcat" -srcfolder build/bin/Clipcat-arm64.app \
            -ov -format UDZO artifacts/Clipcat-macos-arm64.dmg

      - name: Build macOS AMD64 binary
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
          CGO_CFLAGS: "-mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o build/bin/Clipcat

      - name: Bundle and package AMD64 DMG
        run: |
          APP=build/bin/Clipcat-amd64.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp build/darwin/icons.icns "$APP/Resources/iconfile.icns"
          cp build/bin/Clipcat       "$APP/MacOS/Clipcat"
          cp /tmp/Info.plist         "$APP/Info.plist"
          hdiutil create -volname "Clipcat" -srcfolder build/bin/Clipcat-amd64.app \
            -ov -format UDZO artifacts/Clipcat-macos-amd64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: artifacts/*.dmg

  build-windows-amd64:
    runs-on: windows-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ChocolateyInstall\bin",
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              $env:PATH = "$candidate;$env:PATH"
            }
          }
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            throw "makensis not found after NSIS installation"
          }
          Write-Host "Using makensis at $($makensis.Source)"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        shell: bash
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Generate Windows .syso resource
        # Run from build/ so wails3 can locate the windows/ assets with relative paths
        # matching the Taskfile's generate:syso task exactly.
        working-directory: build
        shell: bash
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      - name: Build Windows binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          mkdir -p build/bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/Clipcat-windows-amd64.exe
          rm -f wails_windows_amd64.syso

      - name: Build NSIS installer
        # Paths inside project.nsi are relative to the .nsi file location
        # (build/windows/installer/), so:
        #   ..\..\bin\ = build\bin\   (output)
        #   ARG_WAILS_AMD64_BINARY = ..\..\bin\Clipcat-windows-amd64.exe
        shell: cmd
        run: makensis -DARG_WAILS_AMD64_BINARY=..\..\bin\Clipcat-windows-amd64.exe -DARCH=amd64 build\windows\installer\project.nsi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\bin\Clipcat-windows-amd64.exe dist\Clipcat-windows-amd64.exe
          $installer = Get-ChildItem build\bin\*installer* -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found in build/bin"
          }
          Copy-Item $installer.FullName dist\Clipcat-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-linux-amd64
      - build-macos
      - build-windows-amd64
    if: needs.validate-tag.outputs.is_stable == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURR_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURR_TAG}"
          else
            RANGE="${CURR_TAG}"
          fi

          # ── Download links + first-run notes ────────────────────────────
          {
            echo '## Download'
            echo ''
            echo '| Platform | Link | Note |'
            echo '|---|---|---|'
            echo "| Windows (installer) | [Clipcat-windows-amd64-installer.exe](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/Clipcat-windows-amd64-installer.exe) | ⚠️ SmartScreen will block it - see First-Run Notes below |"
            echo "| macOS Apple Silicon | [Clipcat-macos-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/Clipcat-macos-arm64.dmg) | ⚠️ Gatekeeper will block it - see First-Run Notes below |"
            echo "| macOS Intel         | [Clipcat-macos-amd64.dmg](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/Clipcat-macos-amd64.dmg) | ⚠️ Gatekeeper will block it - see First-Run Notes below |"
            echo "| Linux x86-64        | [Clipcat-linux-amd64](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/Clipcat-linux-amd64) | |"
            echo ''
            echo 'SHA-256 checksums are in `SHA256SUMS.txt` attached below.'
            echo ''
            echo '## First-Run Notes'
            echo ''
            echo 'Clipcat is not code-signed. Each platform may warn you on first launch - the app is safe and fully open source.'
            echo ''
            echo '**Windows - SmartScreen**'
            echo '1. Click **More info**'
            echo '2. Click **Run anyway**'
            echo ''
            echo 'Or right-click the `.exe` -> **Properties** -> check **Unblock** -> **Apply**.'
            echo ''
            echo '**macOS - Gatekeeper**'
            echo ''
            echo 'Right-click the `.dmg` -> **Open** -> click **Open** again. Or go to System Settings -> Privacy & Security -> **Open Anyway**.'
            echo ''
            echo 'Clipcat also needs **Accessibility** permission to simulate paste (Cmd+V). Grant it under System Settings -> Privacy & Security -> Accessibility.'
            echo ''
            echo '**Linux**'
            echo ''
            echo '```bash'
            echo 'chmod +x Clipcat-linux-amd64'
            echo './Clipcat-linux-amd64'
            echo '```'
            echo ''
            echo 'Requires `xdotool` for window focus and paste simulation:'
            echo '```bash'
            echo 'sudo apt install xdotool'
            echo '```'
            echo ''
          } > commit_log.md

          # ── Commits + Contributors ───────────────────────────────────────
          COMMITS_FILE=$(mktemp)
          USERS_FILE=$(mktemp)
          PR_FILE=$(mktemp)
          PR_FOUND=false
          REPO="${{ github.repository }}"

          while IFS=$'\t' read -r HASH MSG; do
            [ -z "$HASH" ] && continue

            COMMIT_JSON=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${HASH}" 2>/dev/null || echo "{}")

            GH_LOGIN=$(echo "$COMMIT_JSON" | jq -r '.author.login // empty' 2>/dev/null || echo "")

            # Check if this commit belongs to a merged PR
            PR_JSON=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${HASH}/pulls" 2>/dev/null || echo "[]")

            PR_LINE=$(echo "$PR_JSON" | jq -r \
              --arg repo "$REPO" \
              '.[0] | select(. != null) | "- \(.title) [#\(.number)](https://github.com/\($repo)/pull/\(.number))"' \
              2>/dev/null || echo "")

            if [ -n "$PR_LINE" ]; then
              echo "$PR_LINE" >> "$PR_FILE"
              PR_FOUND=true
            fi

            # Always build the commit line as a fallback
            if [ -n "$GH_LOGIN" ]; then
              echo "- ${MSG} - @${GH_LOGIN}" >> "$COMMITS_FILE"
              echo "$GH_LOGIN" >> "$USERS_FILE"
            else
              echo "- ${MSG}" >> "$COMMITS_FILE"
            fi
          done < <(git log "$RANGE" --pretty=format:"%H%x09%s" --no-merges)

          # Prefer PR titles; fall back to raw commits when no PRs exist
          if [ "$PR_FOUND" = true ] && [ -s "$PR_FILE" ]; then
            echo "## What's Changed" >> commit_log.md
            echo "" >> commit_log.md
            sort -u "$PR_FILE" >> commit_log.md
            echo "" >> commit_log.md
          elif [ -s "$COMMITS_FILE" ]; then
            echo "## What's Changed" >> commit_log.md
            echo "" >> commit_log.md
            cat "$COMMITS_FILE" >> commit_log.md
            echo "" >> commit_log.md
          fi

          if [ -s "$USERS_FILE" ]; then
            echo "### Contributors" >> commit_log.md
            echo "" >> commit_log.md
            echo "<table><tr>" >> commit_log.md
            for USER in $(sort -u "$USERS_FILE"); do
              printf '  <td align="center"><a href="https://github.com/%s"><img src="https://github.com/%s.png?size=72" width="72" height="72" style="border-radius:50%%" /><br /><b>@%s</b></a></td>\n' \
                "$USER" "$USER" "$USER" >> commit_log.md
            done
            echo "</tr></table>" >> commit_log.md
            echo "" >> commit_log.md
          fi

          rm -f "$COMMITS_FILE" "$USERS_FILE" "$PR_FILE"

      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          test -f binaries/Clipcat-linux-amd64
          test -f binaries/Clipcat-macos-arm64.dmg
          test -f binaries/Clipcat-macos-amd64.dmg
          test -f binaries/Clipcat-windows-amd64-installer.exe

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum Clipcat-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: commit_log.md
          files: binaries/*
