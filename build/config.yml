# Build configuration for Clipcat (Wails v3)
version: '3'

info:
  companyName: "d3uceY"
  productName: "Clipcat"
  productIdentifier: "io.github.d3ucey.clipcat"
  description: "A clipboard manager"
  copyright: "Copyright © 2026 d3uceY"
  comments: "Built using Wails (https://wails.io)"
  version: "v0.11.7"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
