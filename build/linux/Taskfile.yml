version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Linux
    deps:
      - task: build
        vars:
          PRODUCTION: "true"

  create:deb:
    summary: Creates a .deb package using nfpm
    vars:
      VERSION: '{{.VERSION | default "v0.0.0"}}'
      VERSION_BARE: '{{trimPrefix "v" .VERSION}}'
    cmds:
      - sed -i "s/^version:.*/version: \"{{.VERSION_BARE}}\"/" build/linux/nfpm/nfpm.yaml
      - nfpm package --config build/linux/nfpm/nfpm.yaml --packager deb --target bin/

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
