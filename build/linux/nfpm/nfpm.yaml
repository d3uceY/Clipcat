name: "Clipcat"
arch: ${GOARCH}
platform: "linux"
version: "0.11.8"
section: "default"
priority: "extra"
maintainer: "d3uceY <onyekwelujesse1234@gmail.com>"
description: "A clipboard manager"
vendor: "d3uceY"
homepage: "https://github.com/d3uceY/Clipcat"
license: "MIT"
release: "1"

contents:
  - src: "./bin/Clipcat"
    dst: "/usr/local/bin/clipcat"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/clipcat.png"
  - src: "./build/linux/clipcat.desktop"
    dst: "/usr/share/applications/clipcat.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Runtime helpers Clipcat shells out to. Recommended rather than required,
# because each one only matters for a specific session type:
#   xdotool       - focus tracking + paste simulation on X11
#   wmctrl        - focuses the already-running instance on second launch
#   wl-clipboard  - clipboard reads on Wayland
recommends:
  - xdotool
  - wmctrl
  - wl-clipboard

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
