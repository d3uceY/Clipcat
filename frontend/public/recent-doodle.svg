<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 46" fill="none" aria-hidden="true">
  <!--
    Hand-drawn amber paperclip for the "Recent" section header.
    The "clip" of Clipcat, sketched to match the notebook aesthetic:
    #41403e ink outline, an amber wire gradient (light to rich), a
    tilted pose and a little hand-drawn sparkle for personality.
  -->
  <defs>
    <!-- Amber wire: pale top-left, richer amber toward bottom-right -->
    <linearGradient id="clipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn paperclip, tilted a little for a lively pose -->
  <g transform="rotate(-8 16 23)">
    <!-- Ink outline base -->
    <path
      d="M 10 41.5 C 6.2 41.5 5.2 38.8 5.2 35.6 L 5.2 15 C 5.2 7.8 9.2 5.2 16 5.2 C 22.8 5.2 26.8 7.8 26.8 15 L 26.8 31 C 26.8 34.6 24.8 36.8 21.8 36.8 C 18.8 36.8 16.9 34.6 16.9 31.4 L 16.9 19.4 C 16.9 17.2 18 15.8 19.8 15.8 C 21.6 15.8 22.6 17.2 22.6 19.4 L 22.6 30 C 22.6 31.6 21.8 32.4 20.6 32.4"
      stroke="#41403e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Amber wire -->
    <path
      d="M 10 41.5 C 6.2 41.5 5.2 38.8 5.2 35.6 L 5.2 15 C 5.2 7.8 9.2 5.2 16 5.2 C 22.8 5.2 26.8 7.8 26.8 15 L 26.8 31 C 26.8 34.6 24.8 36.8 21.8 36.8 C 18.8 36.8 16.9 34.6 16.9 31.4 L 16.9 19.4 C 16.9 17.2 18 15.8 19.8 15.8 C 21.6 15.8 22.6 17.2 22.6 19.4 L 22.6 30 C 22.6 31.6 21.8 32.4 20.6 32.4"
      stroke="url(#clipGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gloss along the top-left of the wire -->
    <path
      d="M 10 41.5 C 6.2 41.5 5.2 38.8 5.2 35.6 L 5.2 15 C 5.2 7.8 9.2 5.2 16 5.2 C 22.8 5.2 26.8 7.8 26.8 15 L 26.8 31 C 26.8 34.6 24.8 36.8 21.8 36.8 C 18.8 36.8 16.9 34.6 16.9 31.4 L 16.9 19.4"
      stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"
      opacity="0.45" transform="translate(-0.8,-0.8)"/>
  </g>

  <!-- Little hand-drawn sparkle for personality (the "new & shiny" wink) -->
  <g transform="translate(24 7) scale(1.4)">
    <path
      d="M 3.2 0.4 C 3.6 -1 4.1 -1.8 5.4 -2.2 C 4.1 -2.6 3.6 -3.4 3.2 -4.8 C 2.8 -3.4 2.3 -2.6 1 -2.2 C 2.3 -1.8 2.8 -1 3.2 0.4 Z"
      fill="url(#sparkGrad)" stroke="#41403e" stroke-width="0.9" stroke-linejoin="round"/>
  </g>
</svg>
